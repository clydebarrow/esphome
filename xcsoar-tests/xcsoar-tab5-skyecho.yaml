# xcsoar-tab5.yaml with traffic from a SkyEcho, or the GDL90 simulator in gdlsim, over Wi-Fi. XCSoar reads the
# SkyEcho's GDL90 data as a device with the GDL90 driver, which it sets up in a free device slot at its first start.

packages:
  tab5: !include xcsoar-tab5.yaml

esphome:
  name: xcsoar-tab5-skyecho

skyecho:
  id: skyecho_hub

# Networks saved from XCSoar's Config > System > Network; a network that GDL90 data arrives over is joined first.
# fast_connect would go back to the last network at each start instead.
wifi:
  fast_connect: false

wifi_networks:
  id: wifi_networks_hub
  skyecho_id: skyecho_hub

xcsoar:
  skyecho_id: skyecho_hub
  wifi_networks_id: wifi_networks_hub

# Sets the clock, from which XCSoar's GDL90 driver takes the date.
time:
  - platform: skyecho
