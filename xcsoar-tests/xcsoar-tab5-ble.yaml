# xcsoar-tab5-skyecho.yaml with Bluetooth LE serial devices through the Tab5's ESP32-C6. In XCSoar, Config >
# Devices > Edit > Port lists the devices with a serial service (HM-10, Nordic UART, ISSC) while it is open, such
# as tbeam-hm10-gps.yaml; the one picked is kept in XCSoar's profile and connected to at each start.

packages:
  skyecho: !include xcsoar-tab5-skyecho.yaml

external_components:
  - source: github://clydebarrow/esphome@ble_serial
    components: [ble_serial]
    refresh: 1h

esphome:
  name: xcsoar-tab5-ble

esp32_ble:
  max_connections: 2

# ble_serial starts and stops the scan; active, so the scan responses give the names
esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: false

ble_serial:
  id: ble_serial_hub
  max_devices: 2

# The speaker, for XCSoar's traffic alarms: a high-low tone once for a low alarm, twice for an important one and three
# times for an urgent one.
switch:
  - platform: gpio
    id: speaker_enable
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON

audio_dac:
  - platform: es8388
    id: es8388_dac
    # The useful range: below about -50 dB the speaker is barely heard
    volume_min_db: -50dB

# Powers the codec's outputs, which the es8388 setup otherwise leaves off
select:
  - platform: es8388
    dac_output:
      name: DAC Output
      initial_option: BOTH

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    # rtttl fills this from the main loop, which the SkyEcho and BLE work can hold up for a few hundred ms
    buffer_duration: 500ms
    bits_per_sample: 16bit
    sample_rate: 16000

rtttl:
  id: alarm_tone
  speaker: tab5_speaker
  # The es8388 maps volume to attenuation in a straight line, so the default 60% is -38 dB
  gain: 100%

button:
  - platform: template
    name: Test traffic alarm tone
    on_press:
      - rtttl.play: "alarm:d=4,o=6,b=150:a,e,a,e,a,e"

# For tap.py (see xcsoar-tab5-tap.yaml)
api:
  actions:
    - action: tap
      variables:
        x: int
        y: int
      then:
        - lambda: |-
            touchscreen::TouchPoint tp{};
            tp.id = 0;
            tp.x = x;
            tp.y = y;
            id(xcsoar_app)->touch(tp);
        - delay: 100ms
        - lambda: id(xcsoar_app)->release();
    # One finger held at x,y for ms milliseconds
    - action: hold
      variables:
        x: int
        y: int
        ms: int
      then:
        - lambda: |-
            touchscreen::TouchPoint tp{};
            tp.x = x;
            tp.y = y;
            id(xcsoar_app)->touch(tp);
        - delay: !lambda return ms;
        - lambda: id(xcsoar_app)->release();
    # Two fingers centered on x,y, moving from start to finish pixels apart in 10 steps: a pinch or a spread
    - action: pinch
      variables:
        x: int
        y: int
        start: int
        finish: int
      then:
        - lambda: |-
            auto fingers = [&](int gap) {
              touchscreen::TouchPoint a{}, b{};
              a.id = 0;
              b.id = 1;
              a.x = x - gap / 2;
              b.x = x + gap / 2;
              a.y = b.y = y;
              return touchscreen::TouchPoints_t{a, b};
            };
            auto points = fingers(start);
            id(xcsoar_app)->touch(points[0]);
            for (int i = 0; i <= 10; i++) {
              id(xcsoar_app)->update(fingers(start + (finish - start) * i / 10));
              delay(30);
            }
            id(xcsoar_app)->release();

xcsoar:
  ble_serial_id: ble_serial_hub
  # Master Volume in XCSoar's Config > System > Audio
  on_volume:
    - lambda: id(alarm_tone)->set_gain(volume);
    - if:
        condition:
          lambda: return preview;
        then:
          - rtttl.play: "beep:d=16,o=6,b=150:a"
  on_traffic_alarm:
    - rtttl.play:
        rtttl: !lambda |-
          static const char *const TUNES[] = {
              "alarm:d=4,o=6,b=150:a,e",
              "alarm:d=4,o=6,b=150:a,e,a,e",
              "alarm:d=4,o=6,b=150:a,e,a,e,a,e",
          };
          return std::string(TUNES[std::clamp<int>(level, 1, 3) - 1]);
