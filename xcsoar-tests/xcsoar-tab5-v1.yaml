# xcsoar-tab5-ble.yaml for the first Tab5: an ILI9881C panel and a GT911 touch controller instead of the ST7123.

packages:
  ble: !include xcsoar-tab5-ble.yaml
  gps: !include usb-gps.yaml

esphome:
  name: xcsoar-tab5-v1

display:
  - id: !extend lcd
    model: M5STACK-TAB5
    # 60 MHz refreshes at 48 Hz, which flickers visibly; 75 MHz gives 60 Hz
    pclk_frequency: 75MHz

touchscreen:
  - id: !extend touch
    platform: gt911
