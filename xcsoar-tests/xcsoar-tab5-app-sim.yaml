# xcsoar-tab5.yaml with scripted touches for testing XCSoar itself without anyone at the screen: 20 s after
# boot it taps SIM on the start screen, 20 s later Close on the welcome dialog, which leaves the map in simulator
# mode. It also logs the free internal RAM. Coordinates are in XCSoar's landscape screen (1280x720).

packages:
  tab5: !include xcsoar-tab5.yaml

esphome:
  name: xcsoar-tab5-app-sim

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t step = 0;
          const uint32_t n = step++;
          auto *xcsoar = id(xcsoar_app);
          touchscreen::TouchPoint tp{};
          tp.id = 0;
          // the SIM half of the FLY / SIM button
          if (n == 200) {
            tp.x = 870;
            tp.y = 620;
            xcsoar->touch(tp);
            ESP_LOGI("touch_sim", "tap SIM");
          } else if (n == 400) {
            // Close on the welcome dialog shown at the first start, bottom left
            tp.x = 30;
            tp.y = 705;
            xcsoar->touch(tp);
            ESP_LOGI("touch_sim", "tap Close");
          } else if (n == 201 || n == 401) {
            xcsoar->release();
          }
  # internal RAM, which FreeRTOS objects need
  - interval: 5s
    then:
      - lambda: |-
          ESP_LOGI("heap", "internal free %u, largest %u, minimum %u",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL),
                   (unsigned) heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL));
