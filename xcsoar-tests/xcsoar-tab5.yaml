# XCSoar on an M5Stack Tab5 (ST7123 panel), drawing in landscape through two frame buffers, with its data on the
# SD card (in /XCSoar on the card).
# xcsoar_path is relative to this file: a checkout of the XCSoar branch with esp32/xcsoar next to this
# worktree. Flash over USB: python -m esphome run xcsoar-tests/xcsoar-tab5.yaml

substitutions:
  xcsoar_path: ../../xcsoar-src

packages:
  network: !include network.yaml
  storage: !include storage-components.yaml

esphome:
  name: xcsoar-tab5
  includes:
    - tab5_power.h
  on_boot:
    # Before the backlight is set up; after a timer wake it stays off
    - priority: 1400
      then:
        - lambda: tab5_power::release_backlight();
    # After the INA226 and the I/O expanders, before the display and XCSoar: after a timer wake, sleep again or
    # switch off
    - priority: 650
      then:
        - lambda: |-
            const float current = tab5_power::read_start_current(id(battery_monitor), id(battery_current));
            id(start_battery_current) = current;
            ESP_LOGI("tab5_power", "Battery current at start %.3f A", current);
            if (tab5_power::woken_by_timer())
              tab5_power::sleep_or_switch_off(current, id(wifi_power), id(power_off));
    # The RX8130 keeps the time while the Tab5 is off; XCSoar dates GDL90 fixes and the club flights from it
    - then:
        - rx8130.read_time: rtc

esp32:
  variant: esp32p4
  engineering_sample: true
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # The checks stay; their messages and file names would take about 100 kB of flash
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT: y
      # The panel's DMA restarts each frame from an interrupt; without this it waits while flash is written (NVS),
      # and the panel misses a frame: a white flash
      CONFIG_LCD_DSI_ISR_CACHE_SAFE: y

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  speed: 200MHz

esp_ldo:
  - id: ldo_dsi
    channel: 3
    voltage: 2.5V
  # GPIO39 to GPIO44 (the SD card slot) are powered by LDO channel 4, passed through at 3.3V
  - id: ldo_sd
    channel: 4
    voltage: passthrough

spi:
  - id: sd_spi_bus
    clk_pin: GPIO43
    mosi_pin: GPIO44
    miso_pin: GPIO39

storage:
  - platform: sd_spi
    id: sd_card
    spi_id: sd_spi_bus
    cs_pin: GPIO42

filesystem:
  - platform: fatfs
    id: sd_fs
    storage_id: sd_card
    # XCSoar opens its files through the C library
    vfs_path: /sdcard

i2c:
  - id: sys_i2c
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz
    # Before everything else (the highest built-in priority is 1200), so the backlight comes on at once
    setup_priority: 1300
  # Pulsed by tab5_power::sleep_or_switch_off()
  - platform: gpio
    id: power_off
    pin: {pi4ioe5v6408: pi4ioe2, number: 4}

switch:
  # The expander's pins start as inputs, which leaves charging to the board's pull resistor
  - platform: gpio
    id: charge_enable
    name: Charge enable
    pin: {pi4ioe5v6408: pi4ioe2, number: 7}
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    id: charging
    name: Charging
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    initial_state:
      state: on
      brightness: 100%
    # The start-up state is set with the default transition; any fade waits for loop(), after the display's setup
    default_transition_length: 0s
    # Light it before the display's 3 s setup, not once every component is set up
    write_on_setup: true
    # Straight after its output
    setup_priority: 1299

display:
  - platform: mipi_dsi
    id: lcd
    model: M5STACK-TAB5-ST7123
    frame_buffers: 2
    # Landscape with the USB ports on the left
    rotation: 90
    # The model's 80 MHz leaves the panel's PSRAM reads too little time while XCSoar draws: dragging the map gave
    # about 4 underruns (a corrupt frame each) in two minutes, none at 70 MHz (58 Hz)
    pclk_frequency: 70MHz
    reset_pin: {pi4ioe5v6408: pi4ioe1, number: 4}
    # XCSoar draws the screen; this only runs once it has stopped
    update_interval: never
    lambda: |-
      if (!id(xcsoar_stopped))
        return;
      it.fill(Color::BLACK);
      it.print(it.get_width() / 2, it.get_height() / 2 - 40, id(message_font), Color::WHITE,
               display::TextAlign::CENTER, id(xcsoar_quit) ? "Switching off" : "XCSoar has stopped");
      it.print(it.get_width() / 2, it.get_height() / 2 + 40, id(hint_font), Color(0xA0A0A0),
               display::TextAlign::CENTER,
               id(xcsoar_quit) ? "Press the side button to start again" : "Restart the device to start it again");

globals:
  - id: xcsoar_stopped
    type: bool
    initial_value: "false"
  - id: xcsoar_quit
    type: bool
    initial_value: "false"
  - id: start_battery_current
    type: float
    initial_value: NAN

# Only the characters of the messages above: the whole character set at these sizes takes about 200 kB of flash
font:
  - file: ../tests/components/lvgl/roboto.ttf
    id: message_font
    size: 56
    glyphs: " CPRSXabcdefghinoprstuvw"
  - file: ../tests/components/lvgl/roboto.ttf
    id: hint_font
    size: 32
    glyphs: " CPRSXabcdefghinoprstuvw"

touchscreen:
  - platform: st7123
    id: touch
    display: lcd
    interrupt_pin: GPIO23
    reset_pin: {pi4ioe5v6408: pi4ioe1, number: 5}
    # match the display's rotation: 90
    transform:
      swap_xy: true
      mirror_y: true

xcsoar:
  id: xcsoar_app
  # After Quit in XCSoar (its files are saved by then), unmount the SD card, then sleep while a supply is
  # connected, or switch off
  on_stopped:
    - globals.set:
        id: xcsoar_stopped
        value: "true"
    - globals.set:
        id: xcsoar_quit
        value: !lambda return quit;
    - component.update: lcd
    - if:
        condition:
          lambda: return quit;
        then:
          - delay: 2s
          - lambda: |-
              App.run_safe_shutdown_hooks();
              const float current = tab5_power::read_battery_current(id(battery_monitor), id(battery_current));
              ESP_LOGI("tab5_power", "Battery current %.3f A", current);
              tab5_power::sleep_or_switch_off(current, id(wifi_power), id(power_off));
  display_id: lcd
  touchscreen_id: touch
  filesystem_id: sd_fs
  # Send the flights to the flight_upload_url of club.json on the card
  flight_upload: true
  task_stack_size: 262144
  supply_voltage_id: battery_voltage
  # The panel has 294 dpi; XCSoar's layout looks the same at 200, which picks smaller icons and leaves 5 MB more
  # PSRAM free
  dpi: 200
  xcsoar_path: ${xcsoar_path}
  fonts:
    - file: ../tests/components/lvgl/roboto.ttf
      name: Roboto-Regular.ttf

time:
  - platform: rx8130
    id: rtc
    i2c_id: sys_i2c
  - platform: sntp
    on_time_sync:
      - rx8130.write_time: rtc

debug:
  update_interval: 60s

sensor:
  - platform: ina226
    id: battery_monitor
    i2c_id: sys_i2c
    # Before the start-up check in on_boot
    setup_priority: 700
    address: 0x41
    update_interval: 10s
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    bus_voltage:
      id: battery_voltage
      name: Battery voltage
    current:
      # Positive while discharging, negative while charging
      id: battery_current
      name: Battery current
  # Measured before the display and XCSoar are set up, as after a timer wake
  - platform: template
    name: Start-up battery current
    unit_of_measurement: A
    accuracy_decimals: 3
    update_interval: 60s
    lambda: return id(start_battery_current);
  - platform: debug
    # Not the largest PSRAM block: finding it walks the whole heap with interrupts off, which corrupts a frame
    psram:
      name: PSRAM free
    free:
      name: Internal RAM free
