# One-off: installs ESP-Hosted 3.0.10 on the Tab5's ESP32-C6, which adds Bluetooth (the firmware it ships with,
# 1.4.1, has none) and matches the esp_hosted version ESPHome's host side uses. The image is built into this firmware;
# press "Install co-processor firmware" (scripts/api_button.py) once, then flash XCSoar back (xcsoar-tab5-ble.yaml).
# Do not install from on_update_available: the image reports its version as "1", which never equals the "3.0.10" the
# C6 reports, so the update is always "available" and would run again after every restart. No SD card or XCSoar
# here, so no Safe shutdown is needed before the next flash.

packages:
  network: !include network.yaml

esphome:
  name: tab5-c6-update

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  speed: 200MHz

i2c:
  - id: sys_i2c
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

update:
  - platform: esp32_hosted
    id: c6_update
    name: Coprocessor firmware
    type: embedded
    url: https://esphome.github.io/esp-hosted-firmware/v3.0.10/network_adapter_esp32c6.bin
    sha256: c552957fad9f35cf31b0273099dd3b23dc5c388bb43884c6567756ab97fd8cce

button:
  - platform: template
    name: Install co-processor firmware
    on_press:
      - update.perform:
          id: c6_update
          force_update: true
