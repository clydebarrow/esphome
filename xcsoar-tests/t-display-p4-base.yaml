# Hardware of the LilyGO T-Display-P4 V1.0 with the AMOLED panel (RM69A10, GT9895 touch), shared by the
# bring-up test (t-display-p4.yaml) and XCSoar (xcsoar-t-display-p4.yaml). Wi-Fi is in t-display-p4-network.yaml.
# Logs are on the USB-C port next to the power button (a CH343 on UART0). Its DTR line drives the reset and RTS the
# boot pin, the reverse of the usual wiring, so opening the port can leave the P4 in download mode: pulse DTR alone
# to start it.
# Pins are from https://github.com/Xinyuan-LilyGO/lilygo_device_driver (src/device/t_display_p4/v1/config.h).

external_components:
  - source:
      type: local
      path: ../../gt9895/esphome/components
    components: [gt9895]
  - source:
      type: local
      path: ../../icm20948/esphome/components
    components: [icm20948]

packages:
  network: !include t-display-p4-network.yaml
  storage: !include storage-components.yaml

esp32:
  variant: esp32p4
  engineering_sample: true
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

psram:
  speed: 200MHz

esp_ldo:
  - id: ldo_dsi
    channel: 3
    voltage: 2.5V
  # GPIO39 to GPIO44 (the SD card slot) are powered by LDO channel 4, passed through at 3.3V
  - id: ldo_sd
    channel: 4
    voltage: passthrough

i2c:
  - id: sys_i2c
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
  - id: aux_i2c
    sda: GPIO20
    scl: GPIO21
    frequency: 400kHz

xl9535:
  - id: xl9535_hub
    i2c_id: sys_i2c
    address: 0x20

switch:
  # LilyGO keeps this low; their notes say it must stay on, or chips reset badly and the P4 can stay in download mode
  - platform: gpio
    id: power_3v3
    pin: {xl9535: xl9535_hub, number: 0, inverted: true}
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: usb_phy_power
    pin: {xl9535: xl9535_hub, number: 10}
    restore_mode: ALWAYS_ON
  # The speaker amplifier's power
  - platform: gpio
    id: speaker_enable
    pin: {xl9535: xl9535_hub, number: 6}
    restore_mode: ALWAYS_ON
  # Low powers the SD card, as LilyGO set it; the card answered with the pin either way. After the expander (IO)
  # and before the card (HARDWARE)
  - platform: gpio
    id: sd_power
    pin: {xl9535: xl9535_hub, number: 15, inverted: true}
    restore_mode: ALWAYS_ON
    setup_priority: 850

# The card slot has no pull-ups of its own: LilyGO turns on the internal ones. After the SPI bus (BUS) and before the
# card (HARDWARE)
esphome:
  on_boot:
    - priority: 850
      then:
        - lambda: |-
            for (auto pin : {GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42, GPIO_NUM_44})
              gpio_pullup_en(pin);
    # Reset the ESP32-C6 through its enable, so it starts fresh with every P4 boot (esp32_hosted cannot do it, see
    # t-display-p4-network.yaml), then let the enable float the way LilyGO does, so the C6 R button still works.
    - priority: 800
      then:
        - lambda: |-
            id(xl9535_hub).digital_write(14, false);
            id(xl9535_hub).pin_mode(14, gpio::FLAG_OUTPUT);
            delay(100);
            id(xl9535_hub).digital_write(14, true);
            delay(20);
            id(xl9535_hub).pin_mode(14, gpio::FLAG_INPUT);

spi:
  - id: sd_spi_bus
    clk_pin: GPIO43
    mosi_pin: GPIO44
    miso_pin: GPIO39

storage:
  - platform: sd_spi
    id: sd_card
    spi_id: sd_spi_bus
    cs_pin: GPIO42

filesystem:
  - platform: fatfs
    id: sd_fs
    storage_id: sd_card
    vfs_path: /sdcard

display:
  - platform: mipi_dsi
    id: lcd
    model: LILYGO-T-DISPLAY-P4-AMOLED

# The AMOLED panel's brightness, set by command; on at full brightness unless a saved state says otherwise
light:
  - platform: mipi_dsi
    id: display_brightness
    name: Display brightness
    display_id: lcd
    restore_mode: RESTORE_DEFAULT_ON

touchscreen:
  - platform: gt9895
    id: touch
    i2c_id: sys_i2c
    display: lcd
    reset_pin: {xl9535: xl9535_hub, number: 3}

# The L76K GPS: P4 GPIO22 receives from it. LilyGO's factory firmware sets it to 115200 baud and 5 Hz, which it
# keeps while it has backup power.
uart:
  - id: gps_uart
    rx_pin: GPIO22
    tx_pin: GPIO23
    baud_rate: 115200
    rx_buffer_size: 1024
    # Sets the clock from the GPS: the debug hook sees what XCSoar reads without taking it. The clock is set from
    # the first valid RMC sentence, then once an hour.
    debug:
      direction: RX
      dummy_receiver: false
      after:
        delimiter: "\n"
      sequence:
        - lambda: |-
            static uint32_t last_set = 0;
            static bool set_once = false;
            if (set_once && millis() - last_set < 3600000)
              return;
            // $xxRMC,hhmmss.ss,A,lat,N,lon,E,speed,course,ddmmyy,...*CS
            const std::string line(bytes.begin(), bytes.end());
            if (line.size() < 20 || line[0] != '$' || line.compare(3, 4, "RMC,") != 0)
              return;
            const size_t star = line.find('*');
            if (star == std::string::npos || star + 3 > line.size())
              return;
            uint8_t sum = 0;
            for (size_t i = 1; i < star; i++)
              sum ^= line[i];
            if (sum != std::strtoul(line.substr(star + 1, 2).c_str(), nullptr, 16))
              return;
            std::string fields[10];
            size_t start = 7;
            for (auto &field : fields) {
              const size_t comma = line.find(',', start);
              if (comma == std::string::npos)
                return;
              field = line.substr(start, comma - start);
              start = comma + 1;
            }
            // fields[0] is the time, [1] the status, [8] the date
            if (fields[1] != "A" || fields[0].size() < 6 || fields[8].size() != 6)
              return;
            auto two = [](const std::string &s, size_t i) { return (s[i] - '0') * 10 + (s[i + 1] - '0'); };
            ESPTime t{};
            t.hour = two(fields[0], 0);
            t.minute = two(fields[0], 2);
            t.second = two(fields[0], 4);
            t.day_of_month = two(fields[8], 0);
            t.month = two(fields[8], 2);
            t.year = 2000 + two(fields[8], 4);
            t.recalc_timestamp_utc(false);
            const struct timeval tv = {.tv_sec = t.timestamp, .tv_usec = 0};
            settimeofday(&tv, nullptr);
            id(rtc).write_time();
            set_once = true;
            last_set = millis();
            ESP_LOGI("gps_clock", "Clock set from the GPS: %04u-%02u-%02u %02u:%02u:%02u UTC", t.year, t.month,
                     t.day_of_month, t.hour, t.minute, t.second);

time:
  - platform: pcf8563
    id: rtc
    i2c_id: sys_i2c

# The ICM-20948 motion sensor (accelerometer, gyroscope, and the AK09916 magnetometer behind it)
motion:
  - platform: icm20948
    id: imu
    i2c_id: aux_i2c
    address: 0x68
    update_interval: 100ms

# The BQ27220 battery fuel gauge (a 1000 mAh cell); the LGS4056H charger has no interface
sensor:
  - platform: bq27220
    i2c_id: sys_i2c
    voltage:
      name: Battery voltage
    current:
      name: Battery current
    battery_level:
      name: Battery level
    temperature:
      name: Battery temperature
    time_to_empty:
      name: Battery time to empty

# The speaker: an ES8311 codec on the second I2C bus driving the amplifier
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: aux_i2c

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO9
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO10
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 500ms
    bits_per_sample: 16bit
    sample_rate: 16000

rtttl:
  id: alarm_tone
  speaker: board_speaker

button:
  - platform: template
    name: Test alarm tone
    on_press:
      - rtttl.play: "alarm:d=4,o=6,b=150:a,e,a,e,a,e"
