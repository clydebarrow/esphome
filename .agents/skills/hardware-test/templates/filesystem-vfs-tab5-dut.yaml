# Hardware test of the filesystem's C library layer (vfs_path) on an M5Stack Tab5 with an SD card. At boot it
# checks file, directory, rename and two-task access in /sdcard/vfs-test, then restarts with a file left open; the
# next boot checks that the shutdown saved it. Results are logged as "vfs_test: PASS ..." or "FAIL ...", and a
# summary. See reference/recipes/filesystem.md.

esphome:
  name: filesystem-vfs-tab5
  includes:
    - filesystem-vfs-test.hpp
  on_boot:
    priority: -100
    then:
      # the card is ready a moment after boot
      - delay: 3s
      - lambda: vfs_test::run();

esp32:
  variant: esp32p4
  engineering_sample: true
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  speed: 200MHz

# GPIO39 to GPIO44 (the SD card slot) are powered by LDO channel 4, passed through at 3.3V
esp_ldo:
  - id: ldo_sd
    channel: 4
    voltage: passthrough

spi:
  - id: sd_spi_bus
    clk_pin: GPIO43
    mosi_pin: GPIO44
    miso_pin: GPIO39

storage:
  - platform: sd_spi
    id: sd_card
    spi_id: sd_spi_bus
    cs_pin: GPIO42

filesystem:
  - platform: fatfs
    id: sd_fs
    storage_id: sd_card
    vfs_path: /sdcard
