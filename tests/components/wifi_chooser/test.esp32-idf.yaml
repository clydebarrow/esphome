packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml
  wifi_chooser: !include common.yaml

wifi:
  ssid: SSID
  password: PASSWORD123
  power_save_mode: none

display:
  - platform: mipi_spi
    spi_id: spi_bus
    model: st7789v
    id: wifi_chooser_display
    dimensions:
      width: 240
      height: 320
    data_rate: 80MHz
    cs_pin: GPIO22
    dc_pin: GPIO21
    auto_clear_enabled: false
    invert_colors: false
    update_interval: never
