packages:
  spi: !include ../../test_build_components/common/spi/esp32-p4-idf.yaml

<<: !include common.yaml

http_request:

# The ESP32-P4 has no on-chip Wi-Fi radio; it relies on a co-processor via esp32_hosted.
esp32_hosted:
  variant: ESP32C6
  slot: 1
  active_high: true
  reset_pin: GPIO15
  cmd_pin: GPIO13
  clk_pin: GPIO12
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8

display:
  - platform: ili9xxx
    spi_id: spi_bus
    id: online_image_main_lcd
    model: ili9342
    cs_pin: 20
    dc_pin: 14
    reset_pin: 21
    invert_colors: true
    lambda: |-
      it.fill(Color(0, 0, 0));
      it.image(0, 0, id(online_rgba_image));
