# The Seeed reTerminal D1001 board: display, touch, backlight, SD card, clock, power and Wi-Fi through its ESP32-C6.
# The Wi-Fi settings and their secrets come from the my-devices directory next to the worktrees.

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  speed: 200MHz

preferences:
  flash_write_interval: 1min

esp_ldo:
  - id: ldo_dsi
    channel: 3
    voltage: 2.5V
  # GPIO39 to GPIO44 (the SD card slot, VDD_SDIO on the schematic) are powered by LDO channel 4, passed through at 3.3V
  - id: ldo_sd
    channel: 4
    voltage: passthrough

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO13
  cmd_pin: GPIO6
  clk_pin: GPIO11
  d0_pin: GPIO7
  d1_pin: GPIO8
  d2_pin: GPIO9
  d3_pin: GPIO10

wifi: !include ../../../my-devices/wifi.yaml

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

i2c:
  - id: lcd_i2c
    sda:
      number: GPIO37
      ignore_strapping_warning: true
    scl:
      number: GPIO38
      ignore_strapping_warning: true
    frequency: 400kHz
  - id: misc_i2c
    sda: GPIO20
    scl: GPIO21
    frequency: 400kHz

xl9535:
  id: expander
  i2c_id: misc_i2c

display:
  - platform: mipi_dsi
    id: panel
    model: SEEED-RETERMINAL-D1001

touchscreen:
  - platform: gsl3670
    id: touch
    i2c_id: lcd_i2c
    model: seeed-reterminal-d1001

output:
  - platform: ledc
    id: backlight_output
    pin: 14
    frequency: 1220Hz
    min_power: 15%

light:
  - platform: monochromatic
    output: backlight_output
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

spi:
  - id: sd_spi_bus
    clk_pin: GPIO43
    mosi_pin: GPIO44
    miso_pin: GPIO39

storage:
  - platform: sd_spi
    id: sd_card
    spi_id: sd_spi_bus
    cs_pin: GPIO42

filesystem:
  - platform: fatfs
    id: sd_fs
    storage_id: sd_card
    vfs_path: /sdcard

switch:
  # The card's power switch has a pull-down on its enable, so this must be driven high before the card is used
  - platform: gpio
    id: sd_power
    pin: GPIO46
    restore_mode: ALWAYS_ON
    setup_priority: 900
  - platform: gpio
    id: battery_charge_enable
    pin:
      xl9535: expander
      number: 12
      inverted: true
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: power_hold
    pin:
      xl9535: expander
      number: 10
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: vbat_enable
    pin:
      xl9535: expander
      number: 6
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    id: external_power
    name: External power
    pin:
      number: 4
      inverted: true
      mode: INPUT_PULLUP
  # The green button on top
  - platform: gpio
    id: power_button
    pin:
      number: 3
      # Also the wake pin where a device config sleeps
      allow_other_uses: true
    trigger_on_initial_state: false
  # CHARGE_STATE on the schematic: logged as it reads, to check the battery charges
  - platform: gpio
    id: charge_state
    name: Charge state
    pin:
      number: 15
      mode: INPUT_PULLUP

sensor:
  - platform: adc
    id: vbat
    name: Battery voltage
    pin: 18
    attenuation: auto
    update_interval: 30s
    filters:
      - multiply: 2.0

time:
  - platform: pcf8563
    id: rtc
    i2c_id: misc_i2c
