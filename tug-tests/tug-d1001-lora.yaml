# tug-d1001.yaml, with tows also sent over LoRa while there is no internet, as on the SkyEcho's Wi-Fi: over a UART to
# the relay (tug-relay-link.yaml), a Heltec Wireless Tracker (tug-relay-tracker.yaml) in a bracket outside the case,
# which also gives a GNSS fix and the FLARM traffic it hears.
#
# Wiring, to the pads for the Wio-LR1121 module (U19), which is not fitted. Pad numbers are the module's; check with a
# meter first:
# - Pad 20 or 21 (VDD_RF, from VDD_3V3) to the tracker's 3V3.
# - Pad 1 (GND) to the tracker's GND.
# - Pad 6 (SPI_MOSI, GPIO50), the display's TX, to the tracker's GPIO4 (RX).
# - Pad 7 (SPI_MISO, GPIO49), the display's RX, to the tracker's GPIO5 (TX).
# Pads 4, 5, 8, 12 and 14 (GPIO5, 51, 52, 53 and 54) are spare.
substitutions:
  tug_address: "0x0010"
  clubhouse_address: "0x0001"
  relay_tx_pin: GPIO50
  relay_rx_pin: GPIO49

packages:
  tug: !include tug-d1001.yaml
  relay_link: !include tug-relay-link.yaml
