# The Guition JC1060P470 board: display, touch, SD card, clock and Wi-Fi through its ESP32-C6. From Guition's schematic.
# Flash and logs through the CH340 port. All the USB-C ports and the 4-pin power socket share one 5 V rail, which the
# battery doesn't feed: USB devices on the board need 5 V in at another port or the socket.

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true

logger:
  hardware_uart: UART0

psram:
  speed: 200MHz

preferences:
  flash_write_interval: 1min

esp_ldo:
  - id: ldo_dsi
    channel: 3
    voltage: 2.5V
  # The SD card itself, and GPIO39 to GPIO44, are powered by LDO channel 4
  - id: ldo_sd
    channel: 4
    voltage: passthrough

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

wifi: !include ../../../my-devices/wifi.yaml

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

# Touch and the clock share this bus
i2c:
  - id: main_i2c
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

display:
  - platform: mipi_dsi
    id: panel
    model: JC1060P470
    # Without a reset pulse the panel can stay blank after a cold start
    reset_pin: GPIO27

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: main_i2c
    reset_pin: GPIO22
    interrupt_pin: GPIO21

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23

light:
  - platform: monochromatic
    output: backlight_output
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

spi:
  - id: sd_spi_bus
    clk_pin: GPIO43
    mosi_pin: GPIO44
    miso_pin: GPIO39

storage:
  - platform: sd_spi
    id: sd_card
    spi_id: sd_spi_bus
    cs_pin: GPIO42

filesystem:
  - platform: fatfs
    id: sd_fs
    storage_id: sd_card
    vfs_path: /sdcard

time:
  - platform: rx8025t
    id: rtc
    i2c_id: main_i2c

sensor:
  - platform: adc
    id: vbat
    name: Battery voltage
    pin: GPIO52
    attenuation: auto
    update_interval: 30s
    filters:
      # R2 68k over R6 100k
      - multiply: 1.68
