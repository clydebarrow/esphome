# tug-wave8.yaml, with tows also sent over LoRa while there is no internet, as on the SkyEcho's Wi-Fi: over a UART to
# the relay behind the display (tug-relay-link.yaml), a Heltec Wireless Stick Lite V3 (tug-relay-wsl-uart.yaml) or a
# Heltec Wireless Tracker (tug-relay-tracker.yaml).
#
# Wiring, on the 40-pin header (pin positions as on a Raspberry Pi; check with a meter first):
# - 3V3 to the relay's 3V3. The header's 5V has no power on the battery.
# - GND to the relay's GND.
# - GPIO21 (TX) to the relay's RX, GPIO22 (RX) to the relay's TX.
substitutions:
  tug_address: "0x0010"
  clubhouse_address: "0x0001"
  relay_tx_pin: GPIO21
  relay_rx_pin: GPIO22

packages:
  tug: !include tug-wave8.yaml
  relay_link: !include tug-relay-link.yaml
