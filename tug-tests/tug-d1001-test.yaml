# tug-d1001.yaml for the bench: API actions to step through the screens with aioesphomeapi, uploads to a local Worker
# (wrangler dev), and a short landing confirmation for the simulated tow in fly.py.
substitutions:
  upload_url: http://192.168.1.131:8787/api/tows
  upload_key: local-tug-secret
  skyecho_time_port: "7070"

packages:
  # First, so that the screens' fast_connect: false wins
  bench_wifi: !include bench-wifi.yaml
  tug: !include tug-d1001.yaml
  actions: !include tug-d1001-actions.yaml

esphome:
  name: tug-d1001-test

logger:
  level: VERBOSE
  logs:
    # The wifi tag logs the network password at VERBOSE
    wifi: DEBUG
    binary_sensor: INFO
    lvgl: INFO
    api: DEBUG
    api.connection: DEBUG
    component: INFO
    scheduler: INFO
    i2c: INFO
    xl9535: INFO
    sensor: INFO
    adc: INFO
    touchscreen: INFO
    gsl3670.touchscreen: INFO
    json: INFO
    sd_spi: DEBUG
    fatfs: DEBUG
    filesystem: DEBUG
    skyecho: INFO
    traffic_mgr: INFO

tug_logger:
  upload_url: ${upload_url}
  upload_key: ${upload_key}
  landing_confirm: 15s

interval:
  - interval: 20s
    then:
      - lambda: |-
          ESP_LOGI("test", "External power %s, charge state pin %s, charge enable %s, battery %.2f V",
                   ONOFF(id(external_power).state), ONOFF(id(charge_state).state),
                   ONOFF(id(battery_charge_enable).state), id(vbat).state);
