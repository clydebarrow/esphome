# The tug logger on a reTerminal D1001, with GPS from a SkyEcho over Wi-Fi. Copy the file from the Worker's
# Admin -> Provision a tug to the root of the SD card, and logo.png with it for the splash screen.
# Flash over USB: PYTHONPATH=$PWD python -m esphome run tug-tests/tug-d1001.yaml

substitutions:
  display_width: 800
  display_height: 1280
  ui_rotation: 0

packages:
  board: !include tug-d1001-board.yaml
  common: !include tug-common.yaml

esphome:
  name: tug-d1001
  on_boot:
    priority: -100
    then:
      - lambda: id(rtc).read_time();

time:
  - id: !extend skyecho_time
    on_time_sync:
      - lambda: id(rtc).write_time();

globals:
  - id: powering_off
    type: bool

tug_logger:
  external_power_id: external_power
  battery_id: vbat
  on_power_off:
    - switch.turn_off: power_hold
    # Still running: external power came back. The card is unmounted, so start again
    - delay: 5s
    - lambda: App.safe_reboot();

# Holding the green button for 3 s powers off. With external power the device can't cut its own power, so it releases
# power hold and sleeps: unplugging it then turns it off, and pressing the button wakes it.
binary_sensor:
  - id: !extend power_button
    # Also the wake pin below
    pin:
      number: 3
      allow_other_uses: true
    on_press:
      - script.execute: power_down_script
    # The button itself keeps the power on while it is held, so the power only goes once it is let go. That release
    # must not turn power hold on again.
    on_release:
      - if:
          condition:
            lambda: return !id(powering_off);
          then:
            - script.stop: power_down_script
            - lvgl.widget.update:
                id: power_down_label
                hidden: true

deep_sleep:
  id: sleeper
  # The green button reads high while pressed
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        allow_other_uses: true
    mode: ANY_HIGH

script:
  - id: power_down_script
    mode: single
    then:
      - lvgl.label.update:
          id: power_down_label
          hidden: false
          text: Powering off in 3 s
      - delay: 1s
      - lvgl.label.update:
          id: power_down_label
          text: Powering off in 2 s
      - delay: 1s
      - lvgl.label.update:
          id: power_down_label
          text: Powering off in 1 s
      - delay: 1s
      - lambda: id(powering_off) = true;
      - lvgl.label.update:
          id: power_down_label
          text: Release to power off
      # Saves a flight in progress, and unmounts the SD card
      - lambda: App.run_safe_shutdown_hooks();
      - delay: 500ms
      - switch.turn_off: power_hold
      - wait_until:
          binary_sensor.is_off: power_button
      # Still running, so external power is on. A pressed button would wake it at once
      - delay: 1s
      - script.execute: sleep_script
  # The Shut down button in Settings
  - id: shutdown_script
    mode: single
    then:
      - lambda: id(powering_off) = true;
      - lvgl.label.update:
          id: power_down_label
          hidden: false
          text: Powering off
      # Saves a flight in progress, and unmounts the SD card
      - lambda: App.run_safe_shutdown_hooks();
      - delay: 500ms
      - switch.turn_off: power_hold
      # Still running, so external power is on
      - delay: 1s
      - script.execute: sleep_script
  # With power hold released: unplugging turns the device off, and the green button wakes it
  - id: sleep_script
    mode: single
    then:
      - lvgl.label.update:
          id: power_down_label
          hidden: false
          text: Unplug to power off, or press the button to start again
      - delay: 3s
      - light.turn_off:
          id: backlight
          transition_length: 0s
      # Hold the backlight off now, and the C6 in reset at the last moment: esp_hosted aborts if it sees the C6 go away
      - lambda: |-
          gpio_set_direction(GPIO_NUM_14, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_14, 0);
          gpio_hold_en(GPIO_NUM_14);
          esp_deep_sleep_register_hook(+[]() {
            gpio_set_direction(GPIO_NUM_13, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_13, 0);
            gpio_hold_en(GPIO_NUM_13);
          });
      - deep_sleep.enter: sleeper
