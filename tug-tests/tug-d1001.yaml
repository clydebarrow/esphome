# The tug logger on a reTerminal D1001, with GPS from a SkyEcho over Wi-Fi. Copy the file from the Worker's
# Admin -> Provision a tug to the root of the SD card.
# Flash over USB: PYTHONPATH=$PWD python -m esphome run tug-tests/tug-d1001.yaml

substitutions:
  timezone: Australia/Brisbane

packages:
  board: !include tug-d1001-board.yaml

esphome:
  name: tug-d1001
  on_boot:
    priority: -100
    then:
      - pcf8563.read_time: rtc
      - lambda: |-
          tug_logger::TugUiWidgets w{};
          w.lvgl = id(lvgl_id);
          w.ground_page = id(ground_page);
          w.picker_page = id(picker_page);
          w.review_page = id(review_page);
          w.tow_page = id(tow_page);
          w.settings_page = id(settings_page);
          w.status = id(status_label);
          w.next_fields[0] = id(next_glider);
          w.next_fields[1] = id(next_pilot1);
          w.next_fields[2] = id(next_pilot2);
          w.next_fields[3] = id(next_tug_pilot);
          w.review_count = id(review_count);
          w.flight_height = id(flight_height);
          w.flight_elapsed = id(flight_elapsed);
          w.flight_info = id(flight_info);
          w.picker_title = id(picker_title);
          w.picker_text = id(picker_text);
          w.picker_list = id(picker_list);
          w.review_list = id(review_list);
          w.tow_info = id(tow_info);
          w.tow_fields[0] = id(tow_glider);
          w.tow_fields[1] = id(tow_pilot1);
          w.tow_fields[2] = id(tow_pilot2);
          w.tow_fields[3] = id(tow_tug_pilot);
          w.tow_message = id(tow_message);
          w.discard_label = id(discard_label);
          w.settings_info = id(settings_info);
          w.wifi_list = id(wifi_list);
          w.picker_keyboard = id(picker_keyboard)->obj;
          w.theme_label = id(theme_label);
          w.traffic = id(traffic);
          id(ui).bind(id(logger_id), w);
          id(ui).set_dark_mode(id(dark_mode));

globals:
  - id: ui
    type: tug_logger::TugUi
  - id: dark_mode
    type: bool
    restore_value: true
    initial_value: "false"

skyecho:
  id: skyecho_hub

# Saved networks are kept on the device; a SkyEcho comes first, and the others are used when it is off.
# fast_connect would go back to the last network at each start instead.
wifi:
  fast_connect: false

wifi_networks:
  id: wifi_networks_hub
  skyecho_id: skyecho_hub

tug_logger:
  id: logger_id
  time_id: rtc
  skyecho_id: skyecho_hub
  wifi_networks_id: wifi_networks_hub
  external_power_id: external_power
  battery_id: vbat
  on_takeoff:
    - lvgl.page.show: flight_page
  on_landed:
    - lambda: id(ui).back_to_ground();
  on_power_off:
    - switch.turn_off: power_hold

time:
  - id: !extend rtc
    timezone: ${timezone}
  - platform: skyecho
    timezone: ${timezone}
    on_time_sync:
      - pcf8563.write_time: rtc

# Holding the green button powers off, on battery only: with external power the device can't turn itself off
binary_sensor:
  - id: !extend power_button
    on_press:
      - if:
          condition:
            binary_sensor.is_off: external_power
          then:
            - script.execute: power_down_script
    on_release:
      - script.stop: power_down_script
      - lvgl.widget.update:
          id: power_down_label
          hidden: true
      - switch.turn_on: power_hold

script:
  - id: power_down_script
    mode: single
    then:
      - lvgl.label.update:
          id: power_down_label
          hidden: false
          text: Powering off in 3 s
      - delay: 1s
      - lvgl.label.update:
          id: power_down_label
          text: Powering off in 2 s
      - delay: 1s
      - lvgl.label.update:
          id: power_down_label
          text: Powering off in 1 s
      - delay: 1s
      - lvgl.label.update:
          id: power_down_label
          text: Powering off
      # Saves a flight in progress, and unmounts the SD card
      - lambda: App.run_safe_shutdown_hooks();
      - delay: 500ms
      - switch.turn_off: power_hold

interval:
  - interval: 1s
    then:
      - lambda: id(ui).refresh();

lvgl:
  id: lvgl_id
  byte_order: little_endian
  # Portrait, 800x1280
  rotation: 0
  on_pressing:
    - lambda: id(logger_id).note_activity();
  style_definitions:
    - id: big_button
      height: 220
      width: 100%
      radius: 10
    - id: action_button
      height: 90
      radius: 10
  theme:
    label:
      text_font: montserrat_28
    button:
      text_font: montserrat_28
  top_layer:
    widgets:
      - label:
          id: power_down_label
          hidden: true
          align: center
          width: 50%
          pad_all: 20
          text_align: center
          text_font: montserrat_40
          text_color: white
          bg_color: 0x404040
          bg_opa: cover
          text: ""
      - label:
          id: status_label
          align: top_left
          width: 100%
          height: 92
          pad_all: 8
          text_font: montserrat_28
          text_color: white
          bg_color: 0x202020
          bg_opa: cover
          text: ""
  pages:
    - id: ground_page
      pad_top: 100
      pad_all: 16
      layout:
        type: flex
        flex_flow: column
        pad_row: 12
      widgets:
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_GLIDER);
            widgets:
              - label: {id: next_glider, align: left_mid, text_font: montserrat_40, text: ""}
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_PILOT_1);
            widgets:
              - label: {id: next_pilot1, align: left_mid, text_font: montserrat_40, text: ""}
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_PILOT_2);
            widgets:
              - label: {id: next_pilot2, align: left_mid, text_font: montserrat_40, text: ""}
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_TUG_PILOT);
            widgets:
              - label: {id: next_tug_pilot, align: left_mid, text_font: montserrat_40, text: ""}
        - obj:
            width: 100%
            height: 150
            border_width: 0
            pad_all: 0
            bg_opa: transp
            layout:
              type: flex
              flex_flow: row
              pad_column: 12
            widgets:
              - button:
                  styles: action_button
                  flex_grow: 2
                  on_click:
                    - lambda: id(ui).show_review();
                  widgets:
                    - label: {id: review_count, align: center, text_font: montserrat_40, text: ""}
              - button:
                  styles: action_button
                  flex_grow: 1
                  on_click:
                    - lambda: id(ui).show_settings();
                  widgets:
                    - label: {align: center, text: Settings}

    # Read only: nothing here needs a touch in flight
    - id: flight_page
      pad_top: 96
      pad_all: 0
      widgets:
        - skyecho_traffic:
            id: traffic
            skyecho_id: skyecho_hub
            range: 10km
            max_targets: 8
            range_rings: 3
            ownship_size: 48
            target_size: 40
            text_font: montserrat_28
            width: 790
            height: 790
            align: top_mid
        - obj:
            align: bottom_mid
            width: 780
            height: 370
            border_width: 0
            bg_opa: transp
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_cross: center
            widgets:
              # Right aligned, so that the units stay put as the digits change
              - label: {id: flight_height, width: 100%, text_align: right, text_font: montserrat_48, text: "0 ft"}
              - label: {id: flight_elapsed, width: 100%, text_align: right, text_font: montserrat_48, text: "0:00"}
              - label: {id: flight_info, width: 100%, text_align: right, text_font: montserrat_40, text: ""}

    - id: picker_page
      pad_top: 100
      pad_all: 16
      widgets:
        - label:
            id: picker_title
            align: top_left
            text_font: montserrat_40
            text: ""
        - textarea:
            id: picker_text
            align: top_left
            y: 56
            width: 100%
            height: 80
            one_line: true
            max_length: 64
            text_font: montserrat_40
        - obj:
            id: picker_list
            text_font: montserrat_28
            align: top_left
            y: 250
            width: 100%
            height: 440
            pad_all: 6
        - button:
            styles: action_button
            align: top_left
            y: 148
            width: 370
            on_click:
              - lambda: id(ui).picker_done();
            widgets:
              - label: {align: center, text_font: montserrat_40, text: Done}
        - button:
            styles: action_button
            align: top_right
            y: 148
            width: 370
            on_click:
              - lambda: id(ui).picker_cancel();
            widgets:
              - label: {align: center, text_font: montserrat_40, text: Cancel}
        - keyboard:
            id: picker_keyboard
            textarea: picker_text
            align: bottom_mid
            width: 100%
            height: 420
            mode: text_upper
            text_font: montserrat_28

    - id: review_page
      pad_top: 100
      pad_all: 16
      widgets:
        - obj:
            id: review_list
            text_font: montserrat_28
            align: top_mid
            width: 100%
            height: 1040
            pad_all: 6
        - button:
            styles: action_button
            align: bottom_mid
            width: 300
            on_click:
              - lambda: id(ui).back_to_ground();
            widgets:
              - label: {align: center, text_font: montserrat_40, text: Back}

    - id: tow_page
      pad_top: 100
      pad_all: 16
      widgets:
        - label:
            id: tow_info
            align: top_left
            width: 100%
            text: ""
        - obj:
            align: top_left
            y: 130
            width: 100%
            height: 440
            border_width: 0
            bg_opa: transp
            pad_all: 0
            layout:
              type: flex
              flex_flow: column
              pad_row: 10
            widgets:
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_GLIDER);
                  widgets:
                    - label: {id: tow_glider, align: left_mid, text_font: montserrat_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_PILOT_1);
                  widgets:
                    - label: {id: tow_pilot1, align: left_mid, text_font: montserrat_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_PILOT_2);
                  widgets:
                    - label: {id: tow_pilot2, align: left_mid, text_font: montserrat_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_TUG_PILOT);
                  widgets:
                    - label: {id: tow_tug_pilot, align: left_mid, text_font: montserrat_40, text: ""}
        - label:
            id: tow_message
            align: bottom_left
            y: -210
            width: 100%
            text_color: 0xFF6060
            text: ""
        - button:
            styles: action_button
            align: bottom_left
            y: -105
            width: 370
            bg_color: 0x208020
            on_click:
              - lambda: id(ui).confirm_tow();
            widgets:
              - label: {align: center, text_font: montserrat_40, text: Confirm}
        - button:
            styles: action_button
            align: bottom_right
            y: -105
            width: 370
            bg_color: 0x904020
            on_click:
              - lambda: id(ui).discard_tow();
            widgets:
              - label: {id: discard_label, align: center, text: Not a tow}
        - button:
            styles: action_button
            align: bottom_mid
            width: 100%
            on_click:
              - lambda: id(ui).show_review();
            widgets:
              - label: {align: center, text_font: montserrat_40, text: Back}

    - id: settings_page
      pad_top: 100
      pad_all: 16
      widgets:
        - label:
            id: settings_info
            align: top_left
            width: 100%
            text: ""
        - button:
            styles: action_button
            align: bottom_mid
            y: -100
            width: 100%
            on_click:
              - lambda: |-
                  id(dark_mode) = !id(ui).dark_mode();
                  id(ui).set_dark_mode(id(dark_mode));
            widgets:
              - label: {id: theme_label, align: center, text: "Dark mode: off"}
        - button:
            styles: action_button
            align: bottom_left
            width: 370
            on_click:
              - lambda: id(ui).show_wifi_list();
            widgets:
              - label: {align: center, text: Refresh}
        - button:
            styles: action_button
            align: bottom_right
            width: 370
            on_click:
              - lambda: id(ui).back_to_ground();
            widgets:
              - label: {align: center, text: Back}
        - obj:
            id: wifi_list
            text_font: montserrat_28
            align: top_mid
            y: 200
            width: 100%
            height: 740
            pad_all: 6
