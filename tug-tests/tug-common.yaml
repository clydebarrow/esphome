# The tug logger, for any board with a portrait display of at least 480 wide: its screens, its settings, and what it does
# with them. Each board's file gives display_width and display_height (as the screens are seen) and ui_rotation, with:
#   time id rtc, script shutdown_script (the Settings button), and a tug_logger position source.
# A board with a clock chip reads it at boot, and writes it when skyecho_time syncs.
# Sizes are the ones for an 800x1280 display, multiplied by scale; the fonts follow.

substitutions:
  scale: ${[display_width / 800, display_height / 1280] | min}
  timezone: Australia/Brisbane
  # Where the SkyEcho serves its time; the bench build sets this for gdl90_simulator.py
  skyecho_time_port: "80"

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          tug_logger::TugUiWidgets w{};
          w.lvgl = id(lvgl_id);
          w.splash_box = id(splash_box);
          w.splash_name = id(splash_name);
          w.shutdown_label = id(shutdown_label);
          w.row_height = ${(72 * scale) | round | int};
          w.ground_page = id(ground_page);
          w.picker_page = id(picker_page);
          w.review_page = id(review_page);
          w.tow_page = id(tow_page);
          w.settings_page = id(settings_page);
          w.status = id(status_label);
          w.status_time = id(status_time);
          w.refuel_label = id(refuel_label);
          w.next_fields[0] = id(next_glider);
          w.next_fields[1] = id(next_pilot1);
          w.next_fields[2] = id(next_pilot2);
          w.next_fields[3] = id(next_tug_pilot);
          w.review_count = id(review_count);
          w.flight_height = id(flight_height);
          w.flight_elapsed = id(flight_elapsed);
          w.flight_info = id(flight_info);
          w.picker_title = id(picker_title);
          w.picker_text = id(picker_text);
          w.picker_list = id(picker_list);
          w.review_list = id(review_list);
          w.tow_info = id(tow_info);
          w.tow_fields[0] = id(tow_glider);
          w.tow_fields[1] = id(tow_pilot1);
          w.tow_fields[2] = id(tow_pilot2);
          w.tow_fields[3] = id(tow_tug_pilot);
          w.tow_message = id(tow_message);
          w.discard_label = id(discard_label);
          w.settings_info = id(settings_info);
          w.wifi_list = id(wifi_list);
          w.wifi_dialog = id(wifi_dialog);
          w.wifi_dialog_title = id(wifi_dialog_title);
          w.wifi_password_button = id(wifi_password_button);
          w.wifi_forget_button = id(wifi_forget_button);
          w.firmware_label = id(firmware_label);
          w.tow_height = id(tow_height);
          w.picker_keyboard = id(picker_keyboard)->obj;
          w.theme_label = id(theme_label);
          w.traffic = id(traffic);
          id(ui).bind(id(logger_id), w);
          id(ui).set_dark_mode(id(dark_mode));

font:
  - file: {type: gfonts, family: Montserrat, weight: 700}
    id: bold_28
    size: "${(28 * scale) | round | int}"
    bpp: 4
  - file: {type: gfonts, family: Montserrat, weight: 700}
    id: bold_40
    size: "${(40 * scale) | round | int}"
    bpp: 4
  - file: {type: gfonts, family: Montserrat, weight: 700}
    id: bold_48
    size: "${(48 * scale) | round | int}"
    bpp: 4

globals:
  - id: ui
    type: tug_logger::TugUi
  - id: dark_mode
    type: bool
    restore_value: true
    initial_value: "false"

# Not needed in use, but useful for logs. The key is in secrets.yaml next to this file, which is not committed:
# tug_api_key: "$(openssl rand -base64 32)"
api:
  encryption:
    key: !secret tug_api_key

skyecho:
  id: skyecho_hub

# Saved networks are kept on the device; a SkyEcho comes first, and the others are used when it is off.
# fast_connect would go back to the last network at each start instead.
wifi:
  fast_connect: false
  # Out of range of every network is normal in a tug, so never restart for it
  reboot_timeout: 0s

wifi_networks:
  id: wifi_networks_hub
  skyecho_id: skyecho_hub

tug_logger:
  id: logger_id
  time_id: rtc
  skyecho_id: skyecho_hub
  wifi_networks_id: wifi_networks_hub
  on_takeoff:
    - lvgl.page.show: flight_page
  on_landed:
    - lambda: id(ui).back_to_ground();

time:
  - id: !extend rtc
    timezone: ${timezone}
  - platform: skyecho
    id: skyecho_time
    port: ${skyecho_time_port}
    timezone: ${timezone}

# Firmware updates from the Worker that takes the tows: Settings checks for one, and installs it on a second press
http_request:
  id: http_client
  verify_ssl: true
  timeout: 30s
  watchdog_timeout: 30s

# The main loop is held while an update installs, so each step redraws the screen itself
ota:
  - platform: http_request
    id: ota_http
    on_begin:
      - lvgl.widget.show: ota_box
      - lvgl.label.update:
          id: ota_label
          text: Installing the update
      - lvgl.bar.update:
          id: ota_bar
          value: 0
      - lambda: id(lvgl_id).loop();
    on_progress:
      - lvgl.bar.update:
          id: ota_bar
          value: !lambda return int(x);
      - lvgl.label.update:
          id: ota_label
          text:
            format: "Installing the update: %.0f%%"
            args: [x]
      - lambda: id(lvgl_id).loop();
    on_end:
      - lvgl.bar.update:
          id: ota_bar
          value: 100
      - lvgl.label.update:
          id: ota_label
          text: Update installed. Restarting
      - lambda: id(lvgl_id).loop();
    on_error:
      - lvgl.label.update:
          id: ota_label
          text:
            format: "The update failed (error %u)"
            args: [x]
      - lambda: id(lvgl_id).loop();

script:
  - id: firmware_update_script
    mode: single
    then:
      - lvgl.widget.show: ota_box
      - lvgl.label.update:
          id: ota_label
          text: Starting the update
      # Let the message show before the download holds the main loop
      - delay: 200ms
      # Saves a flight in progress, and unmounts the SD card. The device restarts after a good install
      - lambda: App.run_safe_shutdown_hooks();
      - ota.http_request.flash:
          id: ota_http
          url: !lambda return id(logger_id).firmware_offer().url;
          md5: !lambda return id(logger_id).firmware_offer().md5;
      # Still here, so the install failed. The card is unmounted, so start again
      - lvgl.label.update:
          id: ota_label
          text: The update failed. Restarting
      - lambda: id(ui).firmware_install_failed();
      - delay: 5s
      - lambda: App.safe_reboot();

interval:
  - interval: 1s
    then:
      - lambda: id(ui).refresh();

lvgl:
  id: lvgl_id
  rotation: ${ui_rotation}
  on_pressing:
    - lambda: id(logger_id).note_activity();
  style_definitions:
    - id: big_button
      height: "${(220 * scale) | round | int}"
      width: 100%
      radius: "${(10 * scale) | round | int}"
    - id: action_button
      height: "${(90 * scale) | round | int}"
      radius: "${(10 * scale) | round | int}"
  theme:
    label:
      text_font: bold_28
    button:
      text_font: bold_28
  top_layer:
    widgets:
      # Shown while an update installs
      - obj:
          id: ota_box
          hidden: true
          align: center
          width: 90%
          height: size_content
          pad_all: "${(24 * scale) | round | int}"
          bg_color: 0x404040
          bg_opa: cover
          layout:
            type: flex
            flex_flow: column
            flex_align_cross: center
            pad_row: "${(20 * scale) | round | int}"
          widgets:
            - label:
                id: ota_label
                width: 100%
                text_align: center
                text_font: bold_40
                text_color: white
                text: ""
            - bar:
                id: ota_bar
                width: 100%
                height: "${(40 * scale) | round | int}"
                min_value: 0
                max_value: 100
                value: 0
      - label:
          id: power_down_label
          hidden: true
          align: center
          width: 90%
          pad_all: "${(20 * scale) | round | int}"
          text_align: center
          text_font: bold_40
          text_color: white
          bg_color: 0x404040
          bg_opa: cover
          text: ""
      - label:
          id: status_label
          hidden: true
          align: top_left
          width: 100%
          height: "${(128 * scale) | round | int}"
          pad_all: "${(8 * scale) | round | int}"
          text_font: bold_28
          text_color: white
          bg_color: 0x202020
          bg_opa: cover
          text: ""
      - label:
          id: status_time
          hidden: true
          align: top_right
          x: "${(-8 * scale) | round | int}"
          y: "${(8 * scale) | round | int}"
          text_font: bold_28
          text_color: white
          text: ""
  pages:
    # Shown at the start. White in either theme, as the logo is drawn for a light background
    - id: splash_page
      bg_color: 0xFFFFFF
      bg_opa: cover
      widgets:
        - obj:
            id: splash_box
            align: center
            width: 100%
            height: size_content
            border_width: 0
            bg_opa: transp
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
              pad_row: "${(40 * scale) | round | int}"
            widgets:
              - label:
                  id: splash_name
                  width: 90%
                  text_align: center
                  text_font: bold_48
                  text_color: 0x000000
                  text: ""

    - id: ground_page
      pad_top: "${(136 * scale) | round | int}"
      pad_all: "${(16 * scale) | round | int}"
      layout:
        type: flex
        flex_flow: column
        pad_row: "${(12 * scale) | round | int}"
      widgets:
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_GLIDER);
            widgets:
              - label: {align: left_mid, text_font: bold_40, text: Glider}
              - label: {id: next_glider, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_PILOT_1);
            widgets:
              - label: {align: left_mid, text_font: bold_40, text: Pilot 1}
              - label: {id: next_pilot1, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_PILOT_2);
            widgets:
              - label: {align: left_mid, text_font: bold_40, text: Pilot 2}
              - label: {id: next_pilot2, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
        - button:
            styles: big_button
            on_click:
              - lambda: id(ui).edit_next(tug_logger::TowField::TOW_FIELD_TUG_PILOT);
            widgets:
              - label: {align: left_mid, text_font: bold_40, text: Tug pilot}
              - label: {id: next_tug_pilot, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
        - obj:
            width: 100%
            height: "${(150 * scale) | round | int}"
            border_width: 0
            pad_all: "${(0 * scale) | round | int}"
            bg_opa: transp
            layout:
              type: flex
              flex_flow: row
              pad_column: "${(12 * scale) | round | int}"
            widgets:
              - button:
                  styles: action_button
                  flex_grow: 2
                  on_click:
                    - lambda: id(ui).show_review();
                  widgets:
                    - label: {id: review_count, align: center, text_font: bold_40, text: ""}
              - button:
                  styles: action_button
                  flex_grow: 1
                  on_click:
                    - lambda: id(ui).mark_refuelled();
                  widgets:
                    - label: {id: refuel_label, align: center, text: Refuelled}
              - button:
                  styles: action_button
                  flex_grow: 1
                  on_click:
                    - lambda: id(ui).show_settings();
                  widgets:
                    - label: {align: center, text: Settings}

    # Read only: nothing here needs a touch in flight
    - id: flight_page
      pad_top: "${(132 * scale) | round | int}"
      pad_all: "${(0 * scale) | round | int}"
      widgets:
        - skyecho_traffic:
            id: traffic
            skyecho_id: skyecho_hub
            range: 10km
            max_targets: 8
            range_rings: 3
            ownship_size: "${(48 * scale) | round | int}"
            target_size: "${(40 * scale) | round | int}"
            text_font: bold_28
            width: "${(790 * scale) | round | int}"
            height: "${(790 * scale) | round | int}"
            align: top_mid
        - obj:
            align: bottom_mid
            width: "${(780 * scale) | round | int}"
            height: "${(350 * scale) | round | int}"
            border_width: 0
            bg_opa: transp
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_cross: center
            widgets:
              # Right aligned, so that the units stay put as the digits change
              - label: {id: flight_height, width: 100%, text_align: right, text_font: bold_48, text: "0 ft"}
              - label: {id: flight_elapsed, width: 100%, text_align: right, text_font: bold_48, text: "0:00"}
              - label: {id: flight_info, width: 100%, text_align: right, text_font: bold_40, text: ""}

    - id: picker_page
      pad_top: "${(136 * scale) | round | int}"
      pad_all: "${(16 * scale) | round | int}"
      widgets:
        - label:
            id: picker_title
            align: top_left
            text_font: bold_40
            text: ""
        - textarea:
            id: picker_text
            align: top_left
            y: "${(56 * scale) | round | int}"
            width: 100%
            height: "${(80 * scale) | round | int}"
            one_line: true
            max_length: 64
            text_font: bold_40
        - obj:
            id: picker_list
            text_font: bold_28
            align: top_left
            y: "${(250 * scale) | round | int}"
            width: 100%
            height: "${(440 * scale) | round | int}"
            pad_all: "${(6 * scale) | round | int}"
        - button:
            styles: action_button
            align: top_left
            y: "${(148 * scale) | round | int}"
            width: "${(370 * scale) | round | int}"
            on_click:
              - lambda: id(ui).picker_done();
            widgets:
              - label: {align: center, text_font: bold_40, text: Done}
        - button:
            styles: action_button
            align: top_right
            y: "${(148 * scale) | round | int}"
            width: "${(370 * scale) | round | int}"
            on_click:
              - lambda: id(ui).picker_cancel();
            widgets:
              - label: {align: center, text_font: bold_40, text: Cancel}
        - keyboard:
            id: picker_keyboard
            textarea: picker_text
            align: bottom_mid
            width: 100%
            height: "${(420 * scale) | round | int}"
            mode: text_upper
            text_font: "montserrat_${((14 * scale) | round | int) * 2}"

    - id: review_page
      pad_top: "${(136 * scale) | round | int}"
      pad_all: "${(16 * scale) | round | int}"
      widgets:
        - obj:
            id: review_list
            text_font: bold_28
            align: top_mid
            width: 100%
            height: "${(1030 * scale) | round | int}"
            pad_all: "${(6 * scale) | round | int}"
        - button:
            styles: action_button
            align: bottom_mid
            width: "${(300 * scale) | round | int}"
            on_click:
              - lambda: id(ui).back_to_ground();
            widgets:
              - label: {align: center, text_font: bold_40, text: Back}

    - id: tow_page
      pad_top: "${(136 * scale) | round | int}"
      pad_all: "${(16 * scale) | round | int}"
      widgets:
        - label:
            id: tow_info
            align: top_left
            width: 100%
            text: ""
        - obj:
            align: top_left
            y: "${(130 * scale) | round | int}"
            width: 100%
            height: "${(560 * scale) | round | int}"
            border_width: 0
            bg_opa: transp
            pad_all: "${(0 * scale) | round | int}"
            layout:
              type: flex
              flex_flow: column
              pad_row: "${(10 * scale) | round | int}"
            widgets:
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_GLIDER);
                  widgets:
                    - label: {align: left_mid, text_font: bold_40, text: Glider}
                    - label: {id: tow_glider, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_PILOT_1);
                  widgets:
                    - label: {align: left_mid, text_font: bold_40, text: Pilot 1}
                    - label: {id: tow_pilot1, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_PILOT_2);
                  widgets:
                    - label: {align: left_mid, text_font: bold_40, text: Pilot 2}
                    - label: {id: tow_pilot2, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow(tug_logger::TowField::TOW_FIELD_TUG_PILOT);
                  widgets:
                    - label: {align: left_mid, text_font: bold_40, text: Tug pilot}
                    - label: {id: tow_tug_pilot, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
              - button:
                  styles: action_button
                  width: 100%
                  on_click:
                    - lambda: id(ui).edit_tow_height();
                  widgets:
                    - label: {align: left_mid, text_font: bold_40, text: Release}
                    - label: {id: tow_height, align: right_mid, width: "${(530 * scale) | round | int}", long_mode: dot, text_align: right, text_font: bold_40, text: ""}
        - label:
            id: tow_message
            align: bottom_left
            y: "${(-210 * scale) | round | int}"
            width: 100%
            text_color: 0xFF6060
            text: ""
        - button:
            styles: action_button
            align: bottom_left
            y: "${(-105 * scale) | round | int}"
            width: "${(370 * scale) | round | int}"
            bg_color: 0x208020
            on_click:
              - lambda: id(ui).confirm_tow();
            widgets:
              - label: {align: center, text_font: bold_40, text: Confirm}
        - button:
            styles: action_button
            align: bottom_right
            y: "${(-105 * scale) | round | int}"
            width: "${(370 * scale) | round | int}"
            bg_color: 0xD02020
            on_click:
              - lambda: id(ui).discard_tow();
            widgets:
              - label: {id: discard_label, align: center, text: Not a tow}
        - button:
            styles: action_button
            align: bottom_mid
            width: 100%
            on_click:
              - lambda: id(ui).show_review();
            widgets:
              - label: {align: center, text_font: bold_40, text: Back}

    - id: settings_page
      pad_top: "${(136 * scale) | round | int}"
      pad_all: "${(16 * scale) | round | int}"
      widgets:
        - label:
            id: settings_info
            align: top_left
            width: 100%
            text: ""
        - button:
            styles: action_button
            align: bottom_left
            y: "${(-200 * scale) | round | int}"
            width: "${(370 * scale) | round | int}"
            on_click:
              - if:
                  condition:
                    lambda: return id(ui).firmware_button();
                  then:
                    - script.execute: firmware_update_script
            widgets:
              - label: {id: firmware_label, align: center, text: Check for update}
        - button:
            styles: action_button
            align: bottom_right
            y: "${(-200 * scale) | round | int}"
            width: "${(370 * scale) | round | int}"
            bg_color: 0xD02020
            on_click:
              - lambda: |-
                  if (id(ui).confirm_shutdown())
                    id(shutdown_script).execute();
            widgets:
              - label: {id: shutdown_label, align: center, text: Shut down}
        - button:
            styles: action_button
            align: bottom_mid
            y: "${(-100 * scale) | round | int}"
            width: 100%
            on_click:
              - lambda: |-
                  id(dark_mode) = !id(ui).dark_mode();
                  id(ui).set_dark_mode(id(dark_mode));
            widgets:
              - label: {id: theme_label, align: center, text: "Dark mode: off"}
        - button:
            styles: action_button
            align: bottom_left
            width: "${(370 * scale) | round | int}"
            on_click:
              - lambda: id(ui).show_wifi_list();
            widgets:
              - label: {align: center, text: Refresh}
        - button:
            styles: action_button
            align: bottom_right
            width: "${(370 * scale) | round | int}"
            on_click:
              - lambda: id(ui).back_to_ground();
            widgets:
              - label: {align: center, text: Back}
        - obj:
            id: wifi_list
            text_font: bold_28
            align: top_mid
            # Below the six lines of settings_info
            y: "${(280 * scale) | round | int}"
            width: 100%
            height: "${(550 * scale) | round | int}"
            pad_all: "${(6 * scale) | round | int}"
        # Last, so that it covers the rest of the page, and leaves with the page
        - obj:
            id: wifi_dialog
            hidden: true
            align: center
            width: 100%
            height: 100%
            border_width: 0
            radius: "${(0 * scale) | round | int}"
            pad_all: "${(0 * scale) | round | int}"
            bg_color: 0x000000
            bg_opa: 60%
            widgets:
              - obj:
                  align: center
                  width: "${(700 * scale) | round | int}"
                  height: size_content
                  pad_all: "${(24 * scale) | round | int}"
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: "${(16 * scale) | round | int}"
                  widgets:
                    - label: {id: wifi_dialog_title, width: 100%, text_font: bold_40, text: ""}
                    - button:
                        styles: action_button
                        width: 100%
                        on_click:
                          - lambda: id(ui).wifi_connect();
                        widgets:
                          - label: {align: center, text: Connect}
                    - button:
                        id: wifi_password_button
                        styles: action_button
                        width: 100%
                        on_click:
                          - lambda: id(ui).wifi_change_password();
                        widgets:
                          - label: {align: center, text: Change password}
                    - button:
                        id: wifi_forget_button
                        styles: action_button
                        width: 100%
                        bg_color: 0xD02020
                        on_click:
                          - lambda: id(ui).wifi_forget();
                        widgets:
                          - label: {align: center, text: Forget network}
                    - button:
                        styles: action_button
                        width: 100%
