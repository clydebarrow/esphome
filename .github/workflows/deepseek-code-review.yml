name: DeepSeek Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Crucial for pull_request_target: checkout the PR head commit, 
          # otherwise it checks out the target base branch (main).
          ref: ${{ github.event.pull_request.head.sha }}

      - name: DeepSeek PR Review
        uses: anc42/deepseek-review-action@v1
        with:
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: 'deepseek-chat'
