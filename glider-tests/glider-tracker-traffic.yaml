# What a glider tracker does with traffic, for any board (glider-htit.yaml, glider-tbeam.yaml): each aircraft heard on
# FLARM joins the SkyEcho's ADS-B traffic, and once a second the GNSS fix and the traffic go to a flight app such as
# XCSoar over Bluetooth LE, in NMEA as a FLARM's data port sends them (GPRMC, GPGGA, PGRMZ, PFLAU, PFLAA).
#
# The board's config gives the ids this uses: gnss (a gps component), flarm (flarm_receiver) and tracker
# (glider_tracker).
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // Each aircraft heard on FLARM, once a second, joins the SkyEcho's traffic
            id(flarm).add_on_traffic_callback([](const flarm_receiver::LegacyTarget &target, float rssi) {
              skyecho::FlarmTarget heard{};
              heard.address = target.address;
              heard.icao = target.address_type == 1;
              heard.aircraft_type = target.aircraft_type;
              heard.no_track = target.no_track;
              heard.latitude = target.latitude;
              heard.longitude = target.longitude;
              // Back to the height above the ellipsoid that FLARM sent
              heard.altitude_hae = target.altitude + id(flarm).get_geoid_separation();
              heard.speed = target.speed;
              heard.track = target.course;
              heard.climb_rate = target.climb_rate;
              id(skyecho_hub).add_flarm_target(heard);
            });

wifi:
  reboot_timeout: 0s

# Named "<registration> FLARM" by tracker_identity
esp32_ble:
  id: ble_hub

esp32_ble_server:

ble_serial:
  id: ble

# The SkyEcho's GDL90 traffic and ownship report, which the FLARM targets join. The traffic is placed from this
# tracker's GNSS, given below as the external fix.
skyecho:
  id: skyecho_hub

# Chooses the SkyEcho to join, ahead of the bench networks. In flight a SkyEcho whose signal stays below -75 dBm is
# dropped, and the strongest in range joined.
skyecho_wifi:
  id: skyecho_join

interval:
  - interval: 1s
    then:
      - lambda: |-
          const auto &gps = id(gnss).get_data();
          const bool fix = id(gnss).get_age(gps::GPS_FIELD_LOCATION) < 3000;
          const float speed = gps.speed_knots() * (1852.0f / 3600.0f);
          id(skyecho_join).set_flying(id(tracker).is_flying());
          const float geoid = id(flarm).get_geoid_separation();
          // The traffic is placed from this GNSS, a better receiver than the SkyEcho's
          if (fix) {
            skyecho::SkyEcho::ExternalFix own{};
            own.latitude = gps.latitude();
            own.longitude = gps.longitude();
            own.altitude_valid = gps.has(gps::GPS_FIELD_ALTITUDE);
            own.altitude = gps.altitude() + geoid;
            own.speed_valid = gps.has(gps::GPS_FIELD_SPEED);
            own.speed = speed;
            own.track_valid = gps.has(gps::GPS_FIELD_COURSE) && speed > 1.0f;
            own.track = gps.course();
            id(skyecho_hub).set_external_fix(own);
          }
          if (!id(ble).is_connected())
            return;

          // What a FLARM sends each second on its data port
          skyecho::NmeaFix nmea{};
          nmea.valid = fix;
          nmea.latitude = gps.latitude();
          nmea.longitude = gps.longitude();
          nmea.altitude = gps.altitude();
          nmea.geoid_separation = geoid;
          nmea.speed = speed;
          nmea.course = gps.course();
          nmea.satellites = gps.satellites;
          nmea.hdop = gps.has(gps::GPS_FIELD_HDOP) ? gps.hdop() : 99.9f;
          nmea.time_valid = gps.has(gps::GPS_FIELD_TIME);
          nmea.hour = gps.hour;
          nmea.minute = gps.minute;
          nmea.second = gps.second;
          nmea.centisecond = gps.millisecond / 10;
          nmea.date_valid = gps.has(gps::GPS_FIELD_DATE) && gps.year >= 2024;
          nmea.year = gps.year;
          nmea.month = gps.month;
          nmea.day = gps.day;
          std::string out;
          skyecho::append_gps_sentences(out, nmea);

          skyecho::OwnshipT own;
          const bool placed = id(skyecho_hub).get_traffic_ownship(&own);
          if (placed && id(skyecho_hub).has_pressure_altitude())
            skyecho::append_pgrmz(out, own.report.altitude);
          static skyecho::TrafficT traffic[skyecho::MAX_TRAFFIC_TRACKED];
          static skyecho::gdl90PositionReport_t reports[skyecho::MAX_TRAFFIC_TRACKED];
          size_t count = 0;
          if (placed) {
            id(skyecho_hub).get_traffic(traffic, skyecho::MAX_TRAFFIC_TRACKED);
            for (const auto &t : traffic) {
              if (t.active)
                reports[count++] = t.report;
            }
          } else {
            memset(&own, 0, sizeof(own));
          }
          // Transmitting while a packet has gone out in the last couple of seconds
          static uint32_t sent_count = 0;
          static uint32_t sent_ms = 0;
          if (id(flarm).get_transmit_count() != sent_count) {
            sent_count = id(flarm).get_transmit_count();
            sent_ms = esphome::millis();
          }
          const bool transmitting = sent_count != 0 && esphome::millis() - sent_ms < 2000;
          skyecho::append_flarm_traffic(out, own.report, reports, count, id(skyecho_hub).get_threat_settings(),
                                        skyecho::NmeaStatus{fix, id(tracker).is_flying(), transmitting});
          id(ble).write(out);
