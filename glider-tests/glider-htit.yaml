# A glider's tracker on a Heltec Wireless Tracker (htit-tracker-board.yaml):
# - Tracks for the club (glider_tracker): positions for the live map, its takeoff, and its flight summary after landing,
#   to the clubhouse receiver (receiver-wsl.yaml in the glider-lora worktree) over LoRa.
# - Hears FLARM on the same radio (flarm_receiver) while flying, and as an experiment sends its own position in the
#   legacy FLARM protocol, as SoftRF does, in the slots when LoRa isn't holding the radio.
# - Joins the glider's SkyEcho over Wi-Fi for ADS-B traffic and its pressure altitude: no name is configured, so the
#   same firmware serves any glider. It joins the SkyEcho it remembers, or the strongest in range, and remembers the
#   one whose traffic arrives on the ground (skyecho_wifi).
# - Merges the two into one traffic list, and streams it with the GNSS fix as a FLARM's data port would, in NMEA
#   (GPRMC, GPGGA, PGRMZ, PFLAU, PFLAA), over Bluetooth LE to a flight app such as XCSoar: the HM-10 and Nordic UART
#   serial services both carry it.
#
# One build serves every glider: the glider's address, registration and LoRa key are kept in flash apart from the
# firmware (tracker_identity), written once from the dashboard's tracker page over USB, and kept through updates.
# Until then it sends nothing on LoRa. This is the build published for that page, so it holds no secrets: no Wi-Fi
# networks but the SkyEcho's, no API and no Wi-Fi updates. glider-htit-bench.yaml adds those for the bench.
substitutions:
  # "true" to hear and send FLARM on the ground too, for bench tests
  flarm_on_ground: "false"

packages:
  board: !include htit-tracker-board.yaml
  radio: !include radio.yaml
  traffic: !include glider-tracker-traffic.yaml

esphome:
  name: glider-htit

packet_interface:
  - platform: sx126x
    id: lora
    max_packet_size: 255
    addressing:
      id: lora_addressing
      # Until tracker_identity gives the glider's own
      address: "0x00FF"
      peers:
        # Flight reports and their acknowledgements. No rolling code: a replayed report is a duplicate the server
        # already ignores, and a replayed acknowledgement names a flight that was already acknowledged
        - id: to_clubhouse
          destination: ${clubhouse_address}
          encryption:
            id: clubhouse_key
            key_at_runtime: true
        # Position reports, readable by anyone
        - id: broadcasts
          destination: broadcast

# Shares the LoRa radio, and takes the time and position from the GNSS. Sends while it listens, as the radio is on
# FLARM's channels only then.
flarm_receiver:
  id: flarm
  sx126x_id: radio
  band: AU
  gps_id: gnss
  # Sent as the glider's ICAO address, from its Australian registration (tracker_identity)
  transmit:
    aircraft_type: GLIDER

tracker_identity:
  id: identity
  addressing_id: lora_addressing
  encryption_id: clubhouse_key
  glider_tracker_id: tracker
  flarm_receiver_id: flarm
  esp32_ble_id: ble_hub

glider_tracker:
  id: tracker
  gps_id: gnss
  clubhouse_id: to_clubhouse
  broadcast_id: broadcasts
  battery_id: battery
  flarm_receiver_id: flarm
  flarm_on_ground: ${flarm_on_ground}

binary_sensor:
  - id: !extend user_button
    on_click:
      # A short press lights the screen for a minute
      - min_length: 30ms
        max_length: 1s
        then:
          - lambda: id(screen_until) = esphome::millis() + 60000;
      # A long press, on the bench: a fake takeoff, or the landing of the fake flight
      - min_length: 3s
        max_length: 10s
        then:
          - lambda: id(tracker).fake_takeoff_or_landing();

globals:
  # The screen stays lit until then, in ms, after the button; 0 for not since the start
  - id: screen_until
    type: uint32_t
    initial_value: "0"

font:
  - file: {type: gfonts, family: Roboto Mono, weight: 500}
    id: small
    size: 12

display:
  - id: !extend screen
    update_interval: 1s
    lambda: |-
      // Not drawn while dark
      if (!id(backlight).current_values.is_on())
        return;
      const auto &gps = id(gnss).get_data();
      const bool fix = id(gnss).get_age(gps::GPS_FIELD_LOCATION) < 3000;
      const int row = 13;
      int y = 0;
      it.fill(Color::BLACK);
      if (!id(identity).is_set()) {
        it.printf(0, y, id(small), Color(0xFF8000), "Not set up");
      } else if (id(tracker).is_flying()) {
        const uint32_t s = id(tracker).flight_seconds();
        it.printf(0, y, id(small), Color(0x00FF00), "%s  FLYING %u:%02u", id(identity).registration(),
                  unsigned(s / 3600), unsigned(s / 60 % 60));
      } else {
        it.printf(0, y, id(small), Color::WHITE, "%s  ground", id(identity).registration());
      }
      y += row;
      it.printf(0, y, id(small), fix ? Color::WHITE : Color(0xFF8000), "GPS %s, %u sats", fix ? "fix" : "no fix",
                unsigned(gps.satellites));
      y += row;
      it.printf(0, y, id(small), Color::WHITE, "SkyEcho %s",
                id(skyecho_join).has_skyecho() ? "on" : "off");
      y += row;
      it.printf(0, y, id(small), Color::WHITE, "BLE %s  FLARM %s", id(ble).is_connected() ? "app" : "-",
                id(flarm).is_receiving_flarm() ? "rx" : "-");
      y += row;
      static skyecho::TrafficT traffic[skyecho::MAX_TRAFFIC_TRACKED];
      id(skyecho_hub).get_traffic(traffic, skyecho::MAX_TRAFFIC_TRACKED);
      unsigned count = 0;
      for (const auto &t : traffic)
        count += t.active;
      it.printf(0, y, id(small), Color::WHITE, "Traffic %u", count);
      y += row;
      it.printf(0, y, id(small), Color::WHITE, "Queued %u  %.2fV", unsigned(id(tracker).queued()),
                id(battery).has_state() ? id(battery).state : 0.0f);

interval:
  - interval: 1s
    then:
      - lambda: |-
          const bool fix = id(gnss).get_age(gps::GPS_FIELD_LOCATION) < 3000;
          if (fix) {
            id(board_led).turn_on();
          } else {
            id(board_led).turn_off();
          }
          // The screen is lit while there is no fix, so the wait for one can be seen, and for a minute after the
          // button; dark otherwise, as it warms the tracker
          const bool lit = !fix || static_cast<int32_t>(id(screen_until) - esphome::millis()) > 0;
          if (lit != id(backlight).current_values.is_on()) {
            auto call = lit ? id(backlight).turn_on() : id(backlight).turn_off();
            call.perform();
          }
