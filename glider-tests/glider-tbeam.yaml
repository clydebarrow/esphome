# A glider's tracker on a LilyGO T-Beam with an SX1276 radio, as glider-htit.yaml is on the Heltec Wireless Tracker:
# - Tracks for the club (glider_tracker): positions for the live map, its takeoff, and its flight summary after
#   landing, to the clubhouse receiver over LoRa.
# - Hears FLARM on the same radio while flying, and sends its own position in the legacy FLARM protocol, in the slots
#   when LoRa isn't holding the radio.
# - Joins the glider's SkyEcho over Wi-Fi, merges its ADS-B traffic with FLARM's, and streams it to a flight app over
#   Bluetooth LE (glider-tracker-traffic.yaml).
#
# One build serves every T-Beam: the glider's address, registration and LoRa key are kept in flash apart from the
# firmware (tracker_identity), written once from the dashboard's tracker page over USB, and kept through updates.
# Until then it sends nothing on LoRa. This is the build published for that page, so it holds no secrets.
#
# The T-Beam's power chip (AXP192 or AXP2101, at 0x34) is set at boot to power the GPS and measure the battery.
substitutions:
  # "true" to hear and send FLARM on the ground too, for bench tests
  flarm_on_ground: "false"

packages:
  radio: !include radio.yaml
  traffic: !include glider-tracker-traffic.yaml

esphome:
  name: glider-tbeam
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            auto *bus = id(pmu_bus);
            auto reg = [bus](uint8_t r) {
              uint8_t v = 0;
              bus->write_readv(0x34, &r, 1, &v, 1);
              return v;
            };
            auto set = [bus](uint8_t r, uint8_t v) {
              uint8_t b[2] = {r, v};
              bus->write(0x34, b, 2);
            };
            const uint8_t chip = reg(0x03);
            if (chip == 0x03) {
              set(0x28, (reg(0x28) & 0xF0) | 0x0F);  // AXP192: LDO3 3.3 V, for the GPS
              set(0x12, reg(0x12) | 0x08);           // LDO3 on
              set(0x82, reg(0x82) | 0x80);           // battery voltage ADC on
              id(pmu_type) = 1;
            } else if (chip == 0x4A) {
              set(0x94, 28);                         // AXP2101: ALDO3 3.3 V, for the GPS
              set(0x90, reg(0x90) | 0x04);           // ALDO3 on
              set(0x30, reg(0x30) | 0x01);           // battery voltage ADC on
              set(0x68, reg(0x68) | 0x01);           // battery detection on
              id(pmu_type) = 2;
            }
            ESP_LOGI("tbeam", "Power chip id 0x%02X", chip);

esp32:
  board: ttgo-t-beam
  framework:
    type: esp-idf

# On UART0, through the board's USB serial chip, which also carries the ID and SET lines
logger:
  level: DEBUG

globals:
  # The power chip: 1 for an AXP192, 2 for an AXP2101, 0 if neither answered
  - id: pmu_type
    type: uint8_t
    initial_value: "0"

sensor:
  # The battery's voltage, from the power chip; no reading without a battery
  - platform: template
    id: battery
    name: Battery
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      auto *bus = id(pmu_bus);
      auto reg = [bus](uint8_t r) {
        uint8_t v = 0;
        bus->write_readv(0x34, &r, 1, &v, 1);
        return v;
      };
      if (id(pmu_type) == 1)
        return ((reg(0x78) << 4) | (reg(0x79) & 0x0F)) * 1.1f / 1000.0f;
      if (id(pmu_type) == 2 && (reg(0x00) & 0x08))
        return (((reg(0x34) & 0x3F) << 8) | reg(0x35)) / 1000.0f;
      return NAN;

i2c:
  id: pmu_bus
  sda: GPIO21
  scl: GPIO22

uart:
  id: gps_uart
  rx_pin: GPIO34
  tx_pin: GPIO12
  baud_rate: 9600

gps:
  id: gnss
  uart_id: gps_uart
  update_interval: 60s
  # For the lambdas below
  field_age: true

time:
  - platform: gps
    id: gps_time
    gps_id: gnss

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

sx127x:
  id: radio
  cs_pin: GPIO18
  rst_pin: GPIO23
  dio0_pin: GPIO26
  pa_pin: BOOST
  pa_power: 17
  frequency: ${lora_frequency}
  modulation: LORA
  spreading_factor: ${lora_spreading_factor}
  bandwidth: ${lora_bandwidth}
  preamble_size: ${lora_preamble_size}
  crc_enable: true

packet_interface:
  - platform: sx127x
    id: lora
    max_packet_size: 255
    addressing:
      id: lora_addressing
      # Until tracker_identity gives the glider's own
      address: "0x00FF"
      peers:
        - id: to_clubhouse
          destination: ${clubhouse_address}
          encryption:
            id: clubhouse_key
            key_at_runtime: true
        - id: broadcasts
          destination: broadcast

# Shares the LoRa radio, switching it to FSK while it listens, and takes the time and position from the GPS
flarm_receiver:
  id: flarm
  sx127x_id: radio
  band: AU
  gps_id: gnss
  # Sent as the glider's ICAO address, from its Australian registration (tracker_identity)
  transmit:
    aircraft_type: GLIDER

tracker_identity:
  id: identity
  addressing_id: lora_addressing
  encryption_id: clubhouse_key
  glider_tracker_id: tracker
  flarm_receiver_id: flarm
  esp32_ble_id: ble_hub

glider_tracker:
  id: tracker
  gps_id: gnss
  clubhouse_id: to_clubhouse
  broadcast_id: broadcasts
  battery_id: battery
  flarm_receiver_id: flarm
  flarm_on_ground: ${flarm_on_ground}

binary_sensor:
  # The middle button: a long press on the bench makes a fake takeoff, or the landing of the fake flight
  - platform: gpio
    id: user_button
    pin:
      number: GPIO38
      inverted: true
    on_click:
      - min_length: 3s
        max_length: 10s
        then:
          - lambda: id(tracker).fake_takeoff_or_landing();

font:
  - file: "gfonts://Roboto"
    id: small
    size: 12

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    i2c_id: pmu_bus
    address: 0x3C
    # The board's display is mounted turned a quarter
    rotation: 90
    update_interval: 1s
    lambda: |-
      const auto &gps = id(gnss).get_data();
      const bool fix = id(gnss).get_age(gps::GPS_FIELD_LOCATION) < 3000;
      if (!id(identity).is_set()) {
        it.print(0, 0, id(small), "Not set up");
      } else {
        it.print(0, 0, id(small), id(identity).registration());
        it.print(0, 14, id(small), id(tracker).is_flying() ? "Flying" : "Ground");
      }
      it.printf(0, 28, id(small), "GPS %s %u", fix ? "fix" : "-",
                unsigned(gps.satellites));
      it.printf(0, 42, id(small), "SkyEcho %s", id(skyecho_join).has_skyecho() ? "on" : "-");
      it.printf(0, 56, id(small), "BLE %s", id(ble).is_connected() ? "app" : "-");
      it.printf(0, 70, id(small), "FLARM %s", id(flarm).is_receiving_flarm() ? "rx" : "-");
      if (id(battery).has_state() && !std::isnan(id(battery).state))
        it.printf(0, 84, id(small), "%.2f V", id(battery).state);
